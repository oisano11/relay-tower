name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Code & Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd upstream-monitor
          npm install

      - name: Validate JavaScript Syntax
        run: |
          cd upstream-monitor
          for file in *.js public/app.js; do
            node --check "$file"
          done

      - name: Run regression tests
        working-directory: upstream-monitor
        run: npm test

      - name: Validate Example JSON Files
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "upstream-monitor/data/channels.example.json",
              "upstream-monitor/data/telegram_config.example.json",
              "upstream-monitor/data/auto_switch_config.example.json"
            ];
            for (const f of files) {
              JSON.parse(fs.readFileSync(f, "utf8"));
              console.log("Validated JSON:", f);
            }
          '

      - name: Validate Dockerfile build
        run: |
          docker build -t relay-tower-monitor:test ./upstream-monitor

      - name: Smoke test isolated container startup
        run: |
          container_id=$(docker run -d --network none -e IS_VPS=false relay-tower-monitor:test)
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" node -e 'fetch("http://127.0.0.1:3300/api/auth/status").then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
