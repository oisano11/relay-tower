<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全登录 - 中转塔台 (Relay Tower)</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #edf2f7 50%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-shadow: rgba(37, 99, 235, 0.25);
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0,0,0,0.06);
      padding: 36px 32px;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 14px;
      font-size: 26px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
    }

    .brand-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .alert-box {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.4;
      align-items: center;
      gap: 10px;
    }

    .alert-box.error {
      display: flex;
      background-color: var(--danger-bg);
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      font-size: 16px;
      color: #94a3b8;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      height: 46px;
      padding: 0 42px 0 42px;
      font-size: 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background: #f8fafc;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3.5px var(--primary-shadow);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #94a3b8;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .toggle-pwd:hover {
      color: #475569;
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 13px;
      color: #475569;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px var(--primary-shadow);
      transition: all 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px var(--primary-shadow);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .security-badge {
      margin-top: 24px;
      text-align: center;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-badge">⚡</div>
        <h1>中转塔台 · Relay Tower</h1>
        <p>智能调度与利润风控中枢</p>
      </div>

      <div id="errorBox" class="alert-box" style="display: none;">
        <span style="font-size: 18px;">⚠️</span>
        <span id="errorMessage"></span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="password">管理员密码</label>
          <div class="input-wrapper">
            <span class="input-icon">🔐</span>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="请输入管理密码" 
              required 
              autofocus
            />
            <button type="button" class="toggle-pwd" id="btnTogglePwd" title="显示/隐藏密码">👁</button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>保持登录状态 (30 天)</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">安全登录进入中控</span>
        </button>
      </form>

      <div class="security-badge">
        <span>🛡️</span>
        <span>防爆破拦截已启用 (输错5次自动拉黑15分钟)</span>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const rememberMeCheck = document.getElementById('rememberMe');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const errorBox = document.getElementById('errorBox');
    const errorMessage = document.getElementById('errorMessage');
    const btnTogglePwd = document.getElementById('btnTogglePwd');

    // 检查是否已经登录 (Cookie 或 本地 Token 双重校验)
    const savedToken = localStorage.getItem('auth_token');
    const statusHeaders = {};
    if (savedToken) {
      statusHeaders['Authorization'] = `Bearer ${savedToken}`;
    }

    fetch('/api/auth/status', { headers: statusHeaders })
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) {
          window.location.replace('/');
        }
      })
      .catch(() => {});

    // 显示/隐藏密码
    btnTogglePwd.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      btnTogglePwd.textContent = type === 'password' ? '👁' : '🔒';
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBox.className = 'alert-box error';
      errorBox.style.display = 'flex';
    }

    function hideError() {
      errorBox.className = 'alert-box';
      errorBox.style.display = 'none';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const password = passwordInput.value.trim();
      if (!password) {
        showError('请输入管理密码');
        return;
      }

      btnSubmit.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = '验证中...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password,
            rememberMe: rememberMeCheck.checked
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          if (data.token) {
            try {
              localStorage.setItem('auth_token', data.token);
            } catch (e) {}
          }
          btnText.textContent = '登录成功，正在跳转...';
          setTimeout(() => {
            window.location.replace('/');
          }, 200);
        } else {
          showError(data.error || '登录失败，密码不正确');
          passwordInput.select();
          btnSubmit.disabled = false;
          spinner.style.display = 'none';
          btnText.textContent = '安全登录进入中控';
        }
      } catch (err) {
        showError('无法连接到服务器，请检查网络');
        btnSubmit.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = '安全登录进入中控';
      }
    });
  </script>
</body>
</html>
